# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    charges_directory: '%kernel.project_dir%/public/uploads/charges'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\AdminFinanceAlerteService:
        arguments:
            $loyerRepo: '@App\Repository\AdminLoyerRepository'
            $chargeRepo: '@App\Repository\AdminChargeRepository'

    App\Service\OcrCINService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $googleVisionApiKey: '%env(string:GOOGLE_VISION_API_KEY)%'

    App\Service\SightengineService:
        arguments:
            $apiUser: '%env(API_USER)%'
            $apiSecret: '%env(API_SECRET)%'

    App\Service\PhoneVerificationService:
        arguments:
            $accountSid: '%env(string:TWILIO_ACCOUNT_SID)%'
            $authToken: '%env(string:TWILIO_AUTH_TOKEN)%'
            $verifyServiceSid: '%env(string:TWILIO_VERIFY_SERVICE_SID)%'

    App\EventListener\AiServerListener:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 255 }

    # ── EmailService : injection des paramètres Brevo via le container Symfony ──
    # IMPORTANT : Symfony strip les guillemets des valeurs .env.local correctement.
    # $\_ENV PHP brut NE le fait pas → clé API invalide → email silencieusement ignoré.
    App\Service\EmailService:
        arguments:
            $brevoApiKey:      '%env(string:BREVO_API_KEY)%'
            $brevoSenderEmail: '%env(string:BREVO_SENDER_EMAIL)%'
            $brevoSenderName:  '%env(string:BREVO_SENDER_NAME)%'

    App\Service\ModerationService:
        arguments:
            $apiKey: '%env(string:NINJA_API_KEY)%'
