apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakan-ai
  labels:
    app: sakan-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakan-ai
  template:
    metadata:
      labels:
        app: sakan-ai
    spec:
      containers:
      - name: ai-server
        image: <ACR_NAME>.azurecr.io/sakan-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: sakan-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
